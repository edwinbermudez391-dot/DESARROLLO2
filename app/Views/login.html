<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Encuestas Cali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">

    <div class="glass w-full max-w-md p-8 md:p-12 rounded-2xl shadow-xl border border-slate-200">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-600 text-white mb-4">
                <i class="fas fa-clipboard-check text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Encuestas Cali</h1>
            <p class="text-slate-500 text-sm">Sistema de Recepción y Georreferenciación</p>
        </div>

        <form id="loginForm" class="space-y-5" novalidate>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
                <input type="text" name="username" id="username"
                       class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="admin / ventanilla / enrutador" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input type="password" name="password" id="password"
                       class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                       placeholder="••••••••" required>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow-sm flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i> Iniciar sesión
            </button>
        </form>

        <div id="errorMsg" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2">
            <i class="fas fa-exclamation-circle"></i>
            <span>Credenciales inválidas o usuario inactivo.</span>
        </div>

        <div class="mt-8 text-center text-slate-500 text-xs">
            Usuario de prueba: <code class="text-slate-700">ventanilla</code> / <code class="text-slate-700">configurada localmente</code>
        </div>
    </div>

    <script type="module">
        import { login } from './assets/js/api.js';
        import { saveUser, redirectToRole } from './assets/js/auth.js';

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const data = await login(username, password);
                if (!data.success || !data.user) {
                    throw new Error(data.message || 'La API devolvió una respuesta de inicio de sesión inválida.');
                }
                saveUser(data.user);
                redirectToRole(data.user.id_rol);
            } catch (err) {
                errorMsg.querySelector('span').textContent = err instanceof TypeError
                    ? 'No se pudo conectar con la API. Verifica que Apache esté iniciado y que la URL del servidor sea correcta.'
                    : (err.data?.message || err.message || 'No se pudo iniciar sesión. Inténtalo nuevamente.');
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Genera primero el archivo .env}
      MYSQL_ROOT_HOST: '%'
      TZ: America/Bogota
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DATABASE_MODELO_ENTREGA_1.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./SEEDERS_ENTREGA_1.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '127.0.0.1:18080:80'
    environment:
      DB_HOST: db
      DB_NAME: encuestas_cali
      DB_USER: root
      DB_PASS: ${DB_PASSWORD:?Genera primero el archivo .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Genera primero el archivo .env}
    healthcheck:
      test: [CMD, php, '-r', "exit(@file_get_contents('http://localhost/index.php?route=login') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
